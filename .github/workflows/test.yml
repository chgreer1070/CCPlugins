name: Test Installation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install deps
      run: pip install pyyaml
    - name: Validate manifests, frontmatter, installer sync
      run: python scripts/validate.py
    - name: Compile Python
      run: python -m py_compile install.py uninstall.py hooks/block-ai-attribution.py scripts/validate.py
    - name: Hook unit tests
      run: python hooks/test_block_ai_attribution.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.10', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test installation
      run: |
        python install.py

    - name: Verify commands installed
      run: |
        python -c "import os; assert os.path.exists(os.path.expanduser('~/.claude/commands/refactor.md'))"